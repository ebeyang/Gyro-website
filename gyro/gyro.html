<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gyro Pickleball — Fixed Calendar</title>
<style>
  /* Easy tuning: change these to increase/decrease sizes */
  :root{
    --base-font: 14px;
    --day-font-size: 13px;    /* calendar day number */
    --day-small-size: 10px;   /* calendar small label (booked/has) */
    --slot-font-size: 10px;   /* slot button text */
    --time-font-size: 11px;
    --accent: #7af37f;
    --bg: #071f1b; --bg2:#082f26;
    --panel:#072621; --panel2:#0a3228;
    --muted:#9fd6c2;
    --text:#eaffef;
  }

  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;box-sizing:border-box}
  *,*:before,*:after{box-sizing:inherit}

  .container{max-width:1150px;margin:16px auto;padding:16px}
  header{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .logo{width:56px;height:56px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent)}
  .logo img{width:100%;height:100%;object-fit:cover}
  h1{margin:0;font-size:18px}
  .subtitle{color:var(--muted);font-size:12px;margin-top:6px}

  .layout{display:flex;gap:14px;align-items:flex-start}
  .left{width:200px;min-width:170px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
  .month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--text);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
  
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
  .month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--text);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
  .booking-cta{
    position:relative;
    background:linear-gradient(135deg,#9cff8f,#34c987);
    border:1px solid rgba(255,255,255,0.5);
    color:#04281a;
    padding:9px 14px;
    box-shadow:0 8px 24px rgba(52,201,135,0.3);
    animation:ctaPulse 1.8s ease-in-out infinite;
  }
  .booking-cta:hover{transform:translateY(-1px);box-shadow:0 11px 28px rgba(52,201,135,0.48)}
  .booking-cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
  @keyframes ctaPulse{0%,100%{box-shadow:0 8px 24px rgba(52,201,135,0.28)}50%{box-shadow:0 8px 30px rgba(122,243,127,0.58)}}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;color:var(--muted);font-weight:700;font-size:11px;text-align:center;margin-bottom:6px}

  /* Calendar: fixed cell sizes and clipped content */
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{
    height:40px; min-height:40px; max-height:40px;
    background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);
    border-radius:8px;border:1px solid rgba(255,255,255,0.02);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2px;overflow:hidden;
    font-size:var(--day-font-size);
  }
  .day .num{font-weight:800;line-height:1}
  .day .tag{font-size:var(--day-small-size);color:var(--muted);margin-top:2px;white-space:nowrap}
  .day.past{opacity:0.45;cursor:not-allowed}
  .day.has-booking{box-shadow:0 6px 18px rgba(52,200,135,0.06);border:1px solid rgba(51,195,134,0.08)}

  .right{flex:1;min-width:480px}
  .week-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .week-title{font-weight:900;color:var(--accent);font-size:16px}
  .week-grid{border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,0.03),transparent);border:1px solid rgba(255,255,255,0.03);padding:8px;overflow:auto}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  th,td{padding:6px 4px;text-align:center}
  th.timecol{text-align:left;color:var(--muted);font-weight:800;padding-left:8px;width:95px;font-size:var(--time-font-size)}
  th.daycol{color:var(--accent);font-weight:800;font-size:13px}
  td.slot{padding:6px}
  /* Slot buttons fill width so no horizontal scroll; small font */
  .slot-btn{display:block;width:100%;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);font-weight:800;font-size:var(--slot-font-size);cursor:pointer;white-space:normal;word-break:break-word;line-height:1.25}
  .slot-btn.available{background:linear-gradient(180deg,#052a1f,#063021);color:var(--accent);border:1px solid rgba(126,255,171,0.06)}
  /* make unavailable much more transparent and not highlightable */
  .slot-btn.unavailable{
    opacity:0.18;        /* lower prominence */
    cursor:not-allowed;
    pointer-events:none; /* prevent accidental hover/click */
    filter: grayscale(40%);
  }
  .slot-btn.pending{background:linear-gradient(180deg,#2b4b3d,#0a2e26);color:var(--muted)}
  .slot-btn.paid{background:linear-gradient(180deg,#186a45,#0b3b2a);color:#fff;border:1px solid rgba(60,200,140,0.12)}
  .slot-sub{display:block;font-size:11px;color:var(--muted);margin-top:4px;white-space:normal;word-break:break-word}

  /* selected visual state for available slots */
  .slot-btn.selected{
    outline: 3px solid rgba(122,243,127,0.18);
    box-shadow: 0 6px 18px rgba(122,243,127,0.08);
  }

  /* Modal */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:999}
  .modal .box{background:linear-gradient(180deg,#07241f,#0a2f27);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);color:var(--text);max-width:520px;width:94%}
  .modal h3{margin:0 0 8px 0;color:var(--accent);font-weight:900}
  .input{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);font-size:14px}
  .confirm{background:linear-gradient(180deg,var(--accent),#34c987);padding:8px 12px;border-radius:8px;border:none;color:#04281a;font-weight:900;cursor:pointer}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .pay-qr{width:190px;height:190px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:8px auto}
  .small{font-size:12px;color:var(--muted)}
  @media (max-width:820px){ .layout{flex-direction:column} .left{width:100%} table{min-width:100%}}
  @media (max-width:480px){
    :root{ --slot-font-size:11px; --time-font-size:10px; --day-font-size:12px; }
    th.timecol{width:56px;padding-left:4px}
    th,td{padding:4px 3px}
    .slot-btn{padding:5px 3px}
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="gyro logo.jpg" alt="logo"></div>
      <div>
        <h1>Gyro Pickleball</h1>
        <div class="subtitle">Come, join and put some spin on your game at GYRO!</div>
      </div>
    </header>

    <div class="layout">
      <div class="left">
        <div class="panel">
          <div class="month-row">
            <button id="prev" class="btn">&larr;</button>
            <div id="monthLabel" style="font-weight:900;color:var(--accent)"></div>
            <button id="next" class="btn">&rarr;</button>
          </div>

          <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>

          <div class="rules">
            <div style="font-weight:800;margin-top:8px">Rules</div>
            <div class="small">• Pay & upload receipt to confirm booking. • Name required for booking purposes. • Cancellations are handled by the admin only.</div>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="panel">
          <div class="week-top">
            <div style="display:flex;gap:12px;align-items:center">
              <div class="week-title">Week schedule</div>
              <button id="bookSelectedBtn" class="btn booking-cta" style="display:none" aria-live="polite">Proceed to Payment &rarr;</button>
            </div>
            <div id="weekInfo" class="small">Select a date</div>
          </div>

          <div class="week-grid">
            <table id="scheduleTable" aria-label="Week schedule">
              <thead>
                <tr id="theadRow"><th class="timecol">TIME</th></tr>
              </thead>
              <tbody id="slotsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal"><div class="box" id="modalBox"></div></div>

<script>
/* ====== CLIENT CONFIG - your Apps Script Exec URL ====== */
const GOOGLE_SCRIPT_URL = 'https://gyro-proxy.accanada.workers.dev/';
const SHEET_SECRET = 'ASHTONGREVE53s@t';
/* ===================================================== */

(function(){
  const LOCAL_KEY = 'gyro_fixed_calendar_v1';
  const START_HOUR = 6;
  const END_HOUR = 24;
  const GCASH_NUMBER = '09217335413';

  let bookings = loadBookings();
  let today = new Date(); today.setHours(0,0,0,0);
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();
  let selectedDate = new Date(today);

  // selection state for available slots
  const selectedSlots = new Set();

  const calendarGrid = document.getElementById('calendarGrid');
  const monthLabel = document.getElementById('monthLabel');
  const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  const theadRow = document.getElementById('theadRow'), slotsBody = document.getElementById('slotsBody'), weekInfo = document.getElementById('weekInfo');
  const modal = document.getElementById('modal'), modalBox = document.getElementById('modalBox');
  const bookSelectedBtn = document.getElementById('bookSelectedBtn');

  function loadBookings(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}'); }catch(e){return{}} }
  function saveBookings(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(bookings)); }catch(e){console.warn(e);} }

  function fmtY(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  // slotKey: map (date at 00:00, h) to a key. handles h >= 24 by rolling the date forward.
  function slotKey(date, h) {
    const dt = new Date(date);
    dt.setHours(h, 0, 0, 0); // will roll to next day when h >= 24
    const hour = String(((h % 24) + 24) % 24).padStart(2, '0'); // normalize to 00-23
    return `${fmtY(dt)}_${hour}`;
  }

  function startOfWeek(d){ const dd=new Date(d); const day=dd.getDay(); dd.setDate(dd.getDate()-day); dd.setHours(0,0,0,0); return dd; }
  function isWeekend(d){ return d.getDay()===0 || d.getDay()===6; }

  // formatHour: non-military (12-hour) format without ":00"
  function formatHour(h){
    const hh = ((h%24)+24)%24;
    const ampm = hh < 12 ? 'AM' : 'PM';
    let hour12 = hh % 12;
    if (hour12 === 0) hour12 = 12;
    return `${hour12} ${ampm}`;
  }

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function updateBookSelectedButton(){
    const n = selectedSlots.size;
    if(n > 0){
      bookSelectedBtn.style.display = 'inline-block';
      bookSelectedBtn.textContent = `Proceed to Payment →`;
    } else {
      bookSelectedBtn.style.display = 'none';
      bookSelectedBtn.textContent = 'Proceed to Payment →)';
    }
  }

  function toggleSelection(key, btn){
    if(selectedSlots.has(key)){
      selectedSlots.delete(key);
      btn.classList.remove('selected');
    } else {
      selectedSlots.add(key);
      btn.classList.add('selected');
    }
    updateBookSelectedButton();
  }

  // when user clicks Book Selected, open confirm for ALL selected slots
  bookSelectedBtn.addEventListener('click', ()=> {
    if (selectedSlots.size === 0) return;
    const keys = Array.from(selectedSlots).sort();
    openConfirmPay(keys);
  });

  function keyToDateHour(key){
    const [dateStr, hourStr] = key.split('_');
    const [y,m,d] = dateStr.split('-').map(n => parseInt(n,10));
    return { dateObj: new Date(y, m-1, d), hour: parseInt(hourStr, 10) };
  }

  function slotPrice(dateObj){ return isWeekend(dateObj) ? 300 : 250; }

  function setView(y,m){ viewYear=y; viewMonth=m; monthLabel.textContent = new Date(y,m,1).toLocaleString(undefined,{month:'long',year:'numeric'}); renderCalendar(); }
  function renderCalendar(){
    calendarGrid.innerHTML = '';
    const first = new Date(viewYear, viewMonth, 1);
    const start = first.getDay();
    const total = new Date(viewYear, viewMonth+1, 0).getDate();
    for(let i=0;i<start;i++){ const blank=document.createElement('div'); blank.style.minHeight='40px'; calendarGrid.appendChild(blank); }
    for(let d=1; d<=total; d++){
      const date = new Date(viewYear, viewMonth, d); date.setHours(0,0,0,0);
      let hasBooking = false;
      // check bookings via slotKey so hours >=24 map correctly
      for(let h=START_HOUR; h<=END_HOUR; h++){
        const k = slotKey(date, h);
        if (bookings[k]){ hasBooking = true; break; }
      }
      const cell = document.createElement('div'); cell.className = 'day' + (date < today ? ' past' : '') + (hasBooking ? ' has-booking' : '');
      cell.innerHTML = `<div class="num">${d}</div>${hasBooking?'<div class="tag">Booked</div>':''}`;
      cell.addEventListener('click', ()=> { if(date < today && !hasBooking) return; selectedDate = new Date(date); renderWeek(); });
      calendarGrid.appendChild(cell);
    }
  }

  function renderWeek(){
    const start = startOfWeek(selectedDate);
    // headers
    while(theadRow.children.length>1) theadRow.removeChild(theadRow.lastChild);
    const days=[];
    for(let i=0;i<7;i++){
      const d = new Date(start); d.setDate(start.getDate()+i); d.setHours(0,0,0,0); days.push(d);
      const th = document.createElement('th'); th.className='daycol'; th.textContent = d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); theadRow.appendChild(th);
    }
    weekInfo.textContent = `Week of ${start.toLocaleDateString()}`;

    // rows
    slotsBody.innerHTML = '';
    const now = new Date();
    for(let h=START_HOUR; h<=END_HOUR; h++){
      const tr = document.createElement('tr');
      const th = document.createElement('th'); th.className='timecol'; th.textContent = `${formatHour(h)} - ${formatHour(h+1)}`; tr.appendChild(th);

      for(let i=0;i<7;i++){
        const date = days[i];
        const key = slotKey(date,h);
        let b = bookings[key];
        // a booking the admin marked cancelled in the sheet should free the slot up again
        if (b && String(b.status||'').toLowerCase() === 'cancelled') { delete bookings[key]; b = undefined; }
        const td = document.createElement('td'); td.className='slot';
        const btn = document.createElement('button'); btn.className='slot-btn';
        const slotDateTime = new Date(date); slotDateTime.setHours(h,0,0,0);
        const isPast = slotDateTime.getTime() < now.getTime();

        if(b){
          if(b.status === 'paid'){ btn.classList.add('paid'); btn.textContent = 'Booked'; }
          else { btn.classList.add('pending'); btn.textContent = 'Pending'; }
        } else {
          if(isPast){ btn.classList.add('unavailable'); btn.textContent = 'Unavailable'; }
          else {
            btn.classList.add('available');
            btn.textContent = isWeekend(date) ? 'PHP 300' : 'PHP 250';
            // maintain selected visual if previously selected
            if(selectedSlots.has(key)) btn.classList.add('selected');
          }
        }

        btn.addEventListener('click', ()=> {
          if(btn.classList.contains('paid') || btn.classList.contains('pending')){ openBookingDetails(key,b); return; }
          if(btn.classList.contains('unavailable')) return;
          // toggle selection for available slots
          toggleSelection(key, btn);
        });

        td.appendChild(btn); tr.appendChild(td);
      }
      slotsBody.appendChild(tr);
    }
  }

  // booking flows
  async function openBookingDetails(key, booking){
    showModal(`<h3>Booking</h3><div class="small">Checking latest status…</div>`);

    // check the sheet for the latest status in case the admin cancelled it there
    let liveStatus = booking && booking.status ? booking.status : null;
    try {
      const url = GOOGLE_SCRIPT_URL + '?action=get&slotKey=' + encodeURIComponent(key);
      const r = await fetch(url);
      const json = await r.json();
      if (json && json.status) liveStatus = json.status;
    } catch (e) { /* fall back to the locally cached status if the check fails */ }

    if (String(liveStatus||'').toLowerCase() === 'cancelled') {
      delete bookings[key];
      saveBookings();
      showModal(`
        <h3>Booking Cancelled</h3>
        <div class="small">This booking was cancelled by the admin. The slot is now available.</div>
        <div class="actions"><button id="closeBtn" class="btn">Close</button></div>
      `);
      document.getElementById('closeBtn').onclick = ()=>{ closeModal(); renderCalendar(); renderWeek(); };
      return;
    }

    const status = liveStatus || '—';
    const ref = booking && booking.paymentRef ? escapeHtml(booking.paymentRef) : '—';
    const receiptHtml = booking && booking.receipt ? `<div style="margin-top:8px"><img src="${booking.receipt}" style="max-width:100%;border-radius:8px"></div>` : '';
    showModal(`
      <h3>Booking</h3>
      <div class="small">Slot: ${key.replace('_',' ')}</div>
      <div class="small">Status: <b>${status}</b></div>
      <div class="small">Ref: <b>${ref}</b></div>
      ${receiptHtml}
      <div class="small" style="margin-top:8px">Need to cancel? Please contact us directly — cancellations are handled by the admin.</div>
      <div class="actions">
        <button id="closeBtn" class="btn">Close</button>
        ${status==='pending' ? '<button id="uploadBtn" class="confirm">Upload Receipt</button>' : ''}
      </div>
    `);
    document.getElementById('closeBtn').onclick = closeModal;
    if(document.getElementById('uploadBtn')) document.getElementById('uploadBtn').onclick = ()=> openReceiptUploader(key);
  }

  // keys: array of one or more slotKeys selected for booking. Price scales with
  // how many hours/slots are booked — each slot is priced on its own date (weekday/weekend)
  // and the total is the sum, so booking 2+ hours costs proportionally more.
  function openConfirmPay(keys){
    const items = keys.map(k => {
      const { dateObj, hour } = keyToDateHour(k);
      return { key: k, dateObj, hour, price: slotPrice(dateObj) };
    });
    const total = items.reduce((sum, it) => sum + it.price, 0);
    const listHtml = items.map(it =>
      `<div class="small">${it.dateObj.toLocaleDateString()} · ${formatHour(it.hour)} - ${formatHour(it.hour+1)} — PHP ${it.price}</div>`
    ).join('');
    showModal(`
      <h3>Confirm & Pay</h3>
      ${listHtml}
      <div class="small" style="margin-top:8px">Total (${items.length} slot${items.length>1?'s':''}): <b>PHP ${total}</b></div>
      <div class="field"><label class="small">Your name</label><input id="payerName" class="input" placeholder="Full name"></div>
      <div class="actions"><button id="cancelBtn" class="btn">Cancel</button><button id="confirmBtn" class="confirm">Confirm & Pay</button></div>
    `);
    document.getElementById('cancelBtn').onclick = closeModal;

    // Confirm handler: POST create booking to Apps Script (status=pending) for every
    // selected slot under one shared payment reference, then open payment screen
    document.getElementById('confirmBtn').onclick = async ()=> {
      const name = (document.getElementById('payerName').value||'').trim();
      if(!name){ alert('Please enter your name'); return; }
      const paymentRef = 'GYRO-' + Math.random().toString(36).slice(2,8).toUpperCase();
      try {
        for(const it of items){
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              secret: SHEET_SECRET,
              action: 'create',
              slotKey: it.key,
              date: it.key.split('_')[0],
              hour: it.key.split('_')[1],
              name,
              status: 'pending',
              paymentRef
            })
          });
          // local pending feedback
          bookings[it.key] = { status:'pending', bookedAt: new Date().toISOString(), paymentRef, receipt: null };
          selectedSlots.delete(it.key);
        }
        saveBookings();
        updateBookSelectedButton();
        // refresh and show payment modal
        closeModal(); renderCalendar(); renderWeek();
        openPaymentScreen(items.map(it => it.key), total, paymentRef);
      } catch (err) {
        alert('Could not create booking: ' + (err.message || err));
        closeModal();
      }
    };
  }

  function openPaymentScreen(keys, price, paymentRef){

    const payload = `Pay PHP ${price} to ${GCASH_NUMBER} Ref:${paymentRef}`;
    const qrUrl = `qrCode.jpg?data=${encodeURIComponent(payload)}`;
    showModal(`
      <h3>Pay with GCash</h3>
      <div style="text-align:center"><div class="pay-qr"><img src="${qrUrl}" style="width:100%;height:100%;object-fit:contain"></div></div>
      <div class="small" style="text-align:center">Scan QR or send PHP ${price} to <b>${GCASH_NUMBER}</b> with ref <b>${paymentRef}</b></div>
      <div class="small" style="text-align:center;margin-top:4px">${keys.length} slot${keys.length>1?'s':''} booked with this reference</div>
      <div class="field" style="margin-top:8px"><label class="small">Upload receipt (required)</label><input id="receiptFile" type="file" accept="image/*" class="input"></div>
      <div class="actions"><button id="closeBtn" class="btn">Close</button><button id="uploadBtn" class="confirm">Upload receipt & Confirm</button></div>
    `);
    document.getElementById('closeBtn').onclick = closeModal;

    document.getElementById('uploadBtn').onclick = async ()=>{
      const f = document.getElementById('receiptFile').files[0];
      if(!f){ alert('Choose receipt image'); return; }
      const dataUrl = await fileToDataURL(f);
      try {
        for(const key of keys){
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              secret: SHEET_SECRET,
              action: 'upload',
              slotKey: key,
              receiptBase64: dataUrl.split(',')[1],
              receiptMime: f.type || 'image/png'
            })
          });
          const json = await res.json();
          if (json.error) throw new Error(json.error);
        }
        alert('Receipt uploaded. Admin will confirm the booking in the sheet.');
        closeModal();
        // begin polling for admin confirmation on every booked slot
        let remaining = keys.length, anyPaid = false, anyCancelled = false;
        keys.forEach(key => {
          pollBookingStatus(key, (status, booking) => {
            if (status === 'paid') {
              bookings[key] = { status:'paid', paymentRef: booking.paymentRef || '', receipt: booking.receiptUrl || null };
              anyPaid = true;
            } else if (status === 'cancelled') {
              delete bookings[key];
              anyCancelled = true;
            }
            saveBookings(); renderCalendar(); renderWeek();
            remaining--;
            if(remaining === 0){
              if(anyPaid) alert('Booking confirmed by admin.');
              else if(anyCancelled) alert('Your booking was cancelled by the admin. The slot(s) are now available.');
            }
          });
        });
      } catch (err) {
        console.error(err);
        alert('Receipt upload failed: ' + (err.message || err));
      }
    };
  }

  function openReceiptUploader(key){
    showModal(`
      <h3>Upload Receipt</h3>
      <div class="small">Upload receipt for ref <b>${bookings[key] ? bookings[key].paymentRef : ''}</b></div>
      <div class="field"><input id="receiptFile2" type="file" accept="image/*" class="input"></div>
      <div class="actions"><button id="cancel" class="btn">Cancel</button><button id="upload" class="confirm">Upload & Confirm</button></div>
    `);
    document.getElementById('cancel').onclick = closeModal;
    document.getElementById('upload').onclick = async ()=>{
      const f = document.getElementById('receiptFile2').files[0];
      if(!f){ alert('Choose a file'); return; }
      const dataUrl = await fileToDataURL(f);
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            secret: SHEET_SECRET,
            action: 'upload',
            slotKey: key,
            receiptBase64: dataUrl.split(',')[1],
            receiptMime: f.type || 'image/png'
          })
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error);
        alert('Receipt uploaded. Admin will confirm the booking in the sheet.');
        closeModal();
        pollBookingStatus(key, (status, booking) => {
          if (status === 'paid') {
            bookings[key] = { status:'paid', paymentRef: booking.paymentRef || '', receipt: booking.receiptUrl || null };
            saveBookings(); renderCalendar(); renderWeek();
            alert('Booking confirmed by admin.');
          } else if (status === 'cancelled') {
            delete bookings[key];
            saveBookings(); renderCalendar(); renderWeek();
            alert('Your booking was cancelled by the admin. The slot is now available.');
          }
        });
      } catch (err) {
        console.error(err);
        alert('Receipt upload failed: ' + (err.message || err));
      }
    };
  }

  // small utils
  function showModal(html){ modalBox.innerHTML = html; modal.style.display = 'flex'; }
  function closeModal(){ modal.style.display = 'none'; }
  function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

  function pollBookingStatus(slotKey, onChange, intervalMs = 5000, timeoutMs = 5*60*1000){
    const start = Date.now();
    async function check(){
      try {
        const url = GOOGLE_SCRIPT_URL + '?action=get&slotKey=' + encodeURIComponent(slotKey);
        const r = await fetch(url);
        const json = await r.json();
        const status = String(json.status || '').toLowerCase();
        if (status === 'paid') { onChange('paid', json); return; }
        if (status === 'cancelled') { onChange('cancelled', json); return; }
        if (Date.now() - start < timeoutMs) setTimeout(check, intervalMs);
        else onChange('timeout', json);
      } catch (e) {
        if (Date.now() - start < timeoutMs) setTimeout(check, intervalMs);
        else onChange('error', { error: e.message });
      }
    }
    check();
  }

  // periodically re-check locally tracked bookings against the sheet so a booking
  // the admin cancels there frees the slot up here even without the client polling
  async function syncBookingStatuses(){
    const keys = Object.keys(bookings);
    if(!keys.length) return;
    let changed = false;
    for(const key of keys){
      try {
        const url = GOOGLE_SCRIPT_URL + '?action=get&slotKey=' + encodeURIComponent(key);
        const r = await fetch(url);
        const json = await r.json();
        const sheetStatus = String(json && json.status || '').toLowerCase();
        if (sheetStatus === 'cancelled') { delete bookings[key]; changed = true; }
      } catch (e) { /* ignore transient network errors during background sync */ }
    }
    if(changed){ saveBookings(); renderCalendar(); renderWeek(); }
  }

  // init + events
  prevBtn.addEventListener('click', ()=>{ let m=viewMonth-1; let y=viewYear; if(m<0){m=11;y--;} setView(y,m); renderWeek(); });
  nextBtn.addEventListener('click', ()=>{ let m=viewMonth+1; let y=viewYear; if(m>11){m=0;y++;} setView(y,m); renderWeek(); });

  function renderWeekInner(){
    // compatibility alias kept for older code paths
    renderWeek();
  }

  function renderWeekInner(){ renderWeek(); } // alias kept

  function setView(y,m){ viewYear=y; viewMonth=m; monthLabel.textContent = new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); renderCalendar(); }

  // start
  setView(viewYear, viewMonth);
  renderWeek();
  syncBookingStatuses();
  setInterval(syncBookingStatuses, 30000);

  // expose bookings for debug
  window.__bookings = bookings;

})();
</script>
